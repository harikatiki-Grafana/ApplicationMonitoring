global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: teamcenter-adapter
    static_configs:
      - targets: [teamcenter-adapter:9404]
        labels: {environment: prod, service_group: teamcenter}
  # Add node_exporter targets on port 9100 and windows_exporter targets on 9182.
